name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test and require full statement coverage
        shell: bash
        run: |
          go test ./... -count=1 -coverprofile=cover.out -covermode=atomic
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "coverage ${total}"
          test "${total}" = "100.0%"
