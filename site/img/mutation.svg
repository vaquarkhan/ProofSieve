<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <title>Mutation tiers</title>
  <desc>Tier 1 logic mutants can fail the build. Tier 2 is a warning. Tier 3 log deletion never fails the build.</desc>
  <rect width="720" height="240" fill="#faf7f2"/>
  <g font-family="Georgia, serif">
    <rect x="24" y="24" width="210" height="192" rx="8" fill="#0f3d3e"/>
    <text x="129" y="64" text-anchor="middle" fill="#faf7f2" font-size="20">Tier 1</text>
    <text x="129" y="92" text-anchor="middle" fill="#d7e4e2" font-size="16">Logic</text>
    <text x="129" y="128" text-anchor="middle" fill="#faf7f2" font-size="15">compare, equality,</text>
    <text x="129" y="150" text-anchor="middle" fill="#faf7f2" font-size="15">math, return</text>
    <text x="129" y="186" text-anchor="middle" fill="#faf7f2" font-size="15">Fails under 80%</text>
    <rect x="254" y="24" width="210" height="192" rx="8" fill="#fff" stroke="#0f3d3e" stroke-width="2"/>
    <text x="359" y="64" text-anchor="middle" fill="#0f3d3e" font-size="20">Tier 2</text>
    <text x="359" y="92" text-anchor="middle" fill="#5c564c" font-size="16">Semantic</text>
    <text x="359" y="128" text-anchor="middle" fill="#1c1915" font-size="15">booleans,</text>
    <text x="359" y="150" text-anchor="middle" fill="#1c1915" font-size="15">increment</text>
    <text x="359" y="186" text-anchor="middle" fill="#5c564c" font-size="15">Warns under 70%</text>
    <rect x="484" y="24" width="212" height="192" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="2"/>
    <text x="590" y="64" text-anchor="middle" fill="#5c564c" font-size="20">Tier 3</text>
    <text x="590" y="92" text-anchor="middle" fill="#5c564c" font-size="16">Observability</text>
    <text x="590" y="128" text-anchor="middle" fill="#1c1915" font-size="15">log and print</text>
    <text x="590" y="150" text-anchor="middle" fill="#1c1915" font-size="15">lines deleted</text>
    <text x="590" y="186" text-anchor="middle" fill="#5c564c" font-size="15">Never fails</text>
  </g>
</svg>
