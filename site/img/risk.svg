<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <title>Risk score example totaling 74</title>
  <desc>Eight files against a budget of six contributes 25, added cognitive complexity of 4 contributes 4, a critical path contributes 35, and a kill ratio of 0.5 contributes 10. The score is 74.</desc>
  <rect width="720" height="300" fill="#faf7f2"/>
  <g font-family="Georgia, serif" font-size="16" fill="#1c1915">
    <text x="36" y="40" font-size="20" fill="#0f3d3e">Worked example · score 74</text>
    <text x="36" y="78">Files 8 / 6</text>
    <rect x="220" y="58" width="250" height="28" rx="4" fill="#0f3d3e"/>
    <text x="484" y="78" fill="#5c564c">25</text>
    <text x="36" y="126">Cognitive +4</text>
    <rect x="220" y="106" width="40" height="28" rx="4" fill="#0f3d3e"/>
    <text x="274" y="126" fill="#5c564c">4</text>
    <text x="36" y="174">Critical path</text>
    <rect x="220" y="154" width="350" height="28" rx="4" fill="#0f3d3e"/>
    <text x="584" y="174" fill="#5c564c">35</text>
    <text x="36" y="222">Kill gap 0.5</text>
    <rect x="220" y="202" width="100" height="28" rx="4" fill="#0f3d3e"/>
    <text x="334" y="222" fill="#5c564c">10</text>
    <text x="36" y="268" font-size="18">0.25·F + 0.20·C + 0.35·P + 0.20·K  =  74</text>
  </g>
</svg>
